<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAB STAR dashboard</title>
  <!-- The organised dashboard moved to the site root on 13 Nov 2026.
       This page forwards old links and QR codes, and removes the offline
       cache (service worker) that was registered for this folder. -->
  <meta http-equiv="refresh" content="0; url=../">
  <link rel="canonical" href="https://duckpress.github.io/kabstar-dashboard/">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
           align-items: center; justify-content: center; background: #f7f8fc; color: #0d1832; }
    a { color: #1e4096; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0e1322; color: #eef1fb; } a { color: #8fb0ff; } }
  </style>
  <script>
    (function () {
      var target = '../' + location.search + location.hash;
      var go = function () { location.replace(target); };
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.filter(function (r) { return /\/organised\/$/.test(r.scope); })
                                 .map(function (r) { return r.unregister(); }));
        }).then(go, go);
      } else {
        go();
      }
    })();
  </script>
</head>
<body>
  <p>Papan pemuka telah berpindah / The dashboard has moved:
     <a href="../">duckpress.github.io/kabstar-dashboard</a></p>
</body>
</html>
